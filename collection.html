<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<script>(function(){try{var c=JSON.parse(localStorage.getItem("bibliotheque.config"));var t=c&&c.theme;if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Collection</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PopNote">
<meta name="theme-color" content="#f4efe4">
<link rel="stylesheet" href="css/site.css">
</head>
<body>

<div class="crumb">
  <a class="home-link" href="hub.html">&larr; Retour à l'accueil</a>
  <span class="profile-pill" id="profilePill"></span>
</div>

<main class="screen-main" style="max-width:1000px;">
  <div class="cat-title-row">
    <h1 class="section-title" id="catTitle"></h1>
    <div class="search-box">
      <svg class="search-box-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M20 20l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input type="text" id="searchBox" class="search-input" placeholder="Rechercher…">
    </div>
    <button class="btn btn-primary" id="addBtn">+ Ajouter</button>
  </div>
  <div class="stat-cards" id="catStats"></div>
  <div class="cat-sort" id="catSort">
    <button type="button" class="cat-sort-btn active" data-sort="recent">Récent</button>
    <button type="button" class="cat-sort-btn" data-sort="alpha">Alphabétique</button>
    <button type="button" class="cat-sort-btn" data-sort="note">Mieux noté</button>
  </div>
  <button type="button" class="cover-backfill-link" id="coverBackfillBtn" style="display:none;"></button>

  <div id="content"><p class="empty-state">Chargement…</p></div>
</main>

<!-- Fiche détail : carte cinématique — visuel plein cadre à gauche avec titre
     en incrustation, infos à droite (reprend la proposition envoyée en preview) -->
<div class="fiche-overlay" id="ficheOverlay">
  <div class="fiche-panel">
    <div class="fiche-top-actions">
      <button type="button" class="fiche-icon-btn" id="ficheCoeurBtn" aria-label="Coup de cœur" title="Coup de cœur"></button>
      <button type="button" class="fiche-icon-btn" id="ficheEditBtn" aria-label="Éditer" title="Éditer"></button>
      <button type="button" class="fiche-icon-btn" id="ficheClose" aria-label="Fermer">&times;</button>
    </div>
    <div class="fiche-cover-wrap">
      <div class="fiche-cover" id="ficheCover"></div>
      <div class="fiche-cover-overlay">
        <h1 id="ficheTitre"></h1>
        <p class="sub" id="ficheSub"></p>
      </div>
    </div>
    <div class="fiche-panel-body">
      <div id="ficheNote"></div>
      <p class="fiche-date" id="ficheDate"></p>
      <p class="fiche-avis" id="ficheAvis"></p>
      <div class="fiche-visuels" id="ficheVisuels"></div>
      <div id="ficheFields"></div>
    </div>
    <p class="fiche-brand">PopNote</p>
  </div>
</div>

<!-- Modale ajout / édition -->
<div class="modal-backdrop" id="itemBackdrop">
  <div class="modal" style="max-width:560px;">
    <button class="modal-close" id="itemModalClose">&times;</button>
    <h2 id="itemModalTitle">Ajouter</h2>
    <form id="itemForm">
      <input type="hidden" id="fCatalogueId">
      <input type="hidden" id="fExternalId">

      <div class="field" style="position:relative;">
        <label id="fTitleLabel">Titre</label>
        <input type="text" id="fTitle" required autocomplete="off">
        <div class="search-dropdown" id="searchDropdown"></div>
        <p class="hint">Tape au moins 2 lettres : les résultats les plus probables apparaissent juste en dessous.</p>
      </div>

      <div class="dup-notice" id="dupNotice">
        <span id="dupNoticeText"></span>
        <button type="button" class="btn" id="dupNoticeViewBtn">Voir la fiche</button>
      </div>

      <div class="field">
        <label>Visuel</label>
        <div class="cover-preview-wrap">
          <div class="cover-preview" id="fImagePreview"></div>
          <button type="button" class="heart-toggle" id="fCoeurBtn" aria-label="Coup de cœur" title="Coup de cœur"></button>
          <input type="hidden" id="fCoeur" value="0">
        </div>
        <input type="text" id="fImage" placeholder="URL de l'image (ou choisis un résultat ci-dessus)">
      </div>

      <div class="field">
        <label for="fAnnee">Année</label>
        <input type="text" id="fAnnee" placeholder="ex. 2024">
      </div>

      <div id="catalogueExtraFields"></div>

      <hr style="border:none;border-top:1px solid var(--line);margin:20px 0;">

      <div id="profilFields"></div>

      <div class="modal-actions">
        <button type="button" class="btn btn-danger" id="deleteItemBtn" style="display:none;">Supprimer</button>
        <div class="right">
          <button type="button" class="btn" id="itemCancelBtn">Annuler</button>
          <button type="submit" class="btn btn-primary">Enregistrer</button>
        </div>
      </div>
    </form>
  </div>
</div>

<script src="js/utils.js?v=1"></script>
<script src="js/store.js?v=1"></script>
<script src="js/profiles.js?v=1"></script>
<script src="js/categories-config.js?v=1"></script>
<script src="js/category-icons.js?v=1"></script>
<script src="js/popculture-avatars.js?v=1"></script>
<script src="js/api-adapters.js?v=1"></script>
<script src="js/page-collection.js?v=1"></script>
<script src="js/app-brand.js?v=1"></script>
</body>
</html>
